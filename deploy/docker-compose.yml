# 衡台 HengDesk 默认部署：PostgreSQL 17 + pgvector、Valkey、SeaweedFS（S3 网关）。
# HTTPS：叠加 docker-compose.tls.yml（install.sh --tls-cert/--tls-key 自动处理）。MinIO：叠加 docker-compose.minio.yml；外部 S3：叠加 docker-compose.external-s3.yml。推荐用 install.sh 生成 .env。
name: hengdesk

x-hengdesk-env: &hd-env
  HENGDESK_ENV: ${HENGDESK_ENV:-prod}
  HENGDESK_LOG_LEVEL: ${HENGDESK_LOG_LEVEL:-info}
  HENGDESK_DATABASE_URL: postgres://${POSTGRES_USER:-hengdesk}:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hengdesk}?sslmode=disable
  HENGDESK_REDIS_ADDR: valkey:6379
  HENGDESK_S3_ENDPOINT: ${HENGDESK_S3_ENDPOINT:-http://seaweedfs:8333}
  HENGDESK_S3_REGION: ${HENGDESK_S3_REGION:-us-east-1}
  HENGDESK_S3_BUCKET: ${HENGDESK_S3_BUCKET:-hengdesk}
  HENGDESK_S3_ACCESS_KEY: ${HENGDESK_S3_ACCESS_KEY:?请在 .env 设置 HENGDESK_S3_ACCESS_KEY}
  HENGDESK_S3_SECRET_KEY: ${HENGDESK_S3_SECRET_KEY:?请在 .env 设置 HENGDESK_S3_SECRET_KEY}
  HENGDESK_S3_PATH_STYLE: ${HENGDESK_S3_PATH_STYLE:-true}
  HENGDESK_SESSION_TTL: ${HENGDESK_SESSION_TTL:-12h}
  HENGDESK_SESSION_IDLE_TIMEOUT: ${HENGDESK_SESSION_IDLE_TIMEOUT:-2h}
  HENGDESK_LOGIN_MAX_FAILURES: ${HENGDESK_LOGIN_MAX_FAILURES:-5}
  HENGDESK_LOGIN_LOCKOUT_DURATION: ${HENGDESK_LOGIN_LOCKOUT_DURATION:-15m}
  HENGDESK_COOKIE_SECURE: ${HENGDESK_COOKIE_SECURE:-false}
  HENGDESK_PUBLIC_HTTPS: ${HENGDESK_PUBLIC_HTTPS:-}
  HENGDESK_ADMIN_EMAIL: ${HENGDESK_ADMIN_EMAIL:-admin@hengdesk.local}
  HENGDESK_ADMIN_PASSWORD: ${HENGDESK_ADMIN_PASSWORD:?请在 .env 设置 HENGDESK_ADMIN_PASSWORD}
  HENGDESK_AUDITOR_EMAIL: ${HENGDESK_AUDITOR_EMAIL:-}
  HENGDESK_AUDITOR_PASSWORD: ${HENGDESK_AUDITOR_PASSWORD:-}
  HENGDESK_BACKUP_DIR: /backups
  HENGDESK_AUDIT_RETENTION_DAYS: ${HENGDESK_AUDIT_RETENTION_DAYS:-365}
  HENGDESK_AUDIT_ARCHIVE_SIGN_KEY_FILE: ${HENGDESK_AUDIT_ARCHIVE_SIGN_KEY_FILE:-}
  HENGDESK_OIDC_ISSUER: ${HENGDESK_OIDC_ISSUER:-}
  HENGDESK_OIDC_CLIENT_ID: ${HENGDESK_OIDC_CLIENT_ID:-}
  HENGDESK_OIDC_CLIENT_SECRET: ${HENGDESK_OIDC_CLIENT_SECRET:-}
  HENGDESK_OIDC_REDIRECT_URL: ${HENGDESK_OIDC_REDIRECT_URL:-}
  HENGDESK_OIDC_LINK_BY: ${HENGDESK_OIDC_LINK_BY:-email}
  HENGDESK_OIDC_AUTO_CREATE: ${HENGDESK_OIDC_AUTO_CREATE:-true}
  HENGDESK_OIDC_EMAIL_DOMAINS: ${HENGDESK_OIDC_EMAIL_DOMAINS:-}
  HENGDESK_OIDC_DEPT_CLAIM: ${HENGDESK_OIDC_DEPT_CLAIM:-}
  HENGDESK_OIDC_DEPT_MATCH: ${HENGDESK_OIDC_DEPT_MATCH:-path}
  HENGDESK_OIDC_DEPT_DEFAULT: ${HENGDESK_OIDC_DEPT_DEFAULT:-}
  HENGDESK_OIDC_ENFORCE: ${HENGDESK_OIDC_ENFORCE:-false}
  HENGDESK_OIDC_BREAKGLASS_EMAILS: ${HENGDESK_OIDC_BREAKGLASS_EMAILS:-}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hengdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hengdesk}
    # /backups 与 migrate 共享：migrate 升级前写入 pg_dump 备份，restore.sh 在此容器内 pg_restore。
    entrypoint: ["sh", "-c", "mkdir -p /backups && chown 10001:10001 /backups && chmod 700 /backups && exec docker-entrypoint.sh postgres"]
    volumes: [pgdata:/var/lib/postgresql/data, backups:/backups]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 3s
      retries: 40

  valkey:
    image: valkey/valkey:8.1.11-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      retries: 40

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    environment:
      S3_AK: ${HENGDESK_S3_ACCESS_KEY}
      S3_SK: ${HENGDESK_S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"hengdesk","credentials":[{"accessKey":"$${S3_AK}","secretKey":"$${S3_SK}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes: [seaweeddata:/data]
    # 对象存储只绑本机回环（D-30），不对外暴露
    ports: ["127.0.0.1:${HENGDESK_S3_PORT:-8333}:8333"]

  migrate:
    build: {context: ../server}
    image: hengdesk/server:${HENGDESK_VERSION:-dev}
    command: ["migrate"]
    environment: *hd-env
    volumes: [backups:/backups]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  server:
    image: hengdesk/server:${HENGDESK_VERSION:-dev}
    command: ["server"]
    restart: unless-stopped
    environment: *hd-env
    # 只读挂载备份卷：管理后台据此显示备份盘剩余空间告警。
    volumes: [backups:/backups:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
      valkey: {condition: service_healthy}

  worker:
    image: hengdesk/server:${HENGDESK_VERSION:-dev}
    command: ["worker"]
    restart: unless-stopped
    environment: *hd-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      valkey: {condition: service_healthy}

  web:
    build: {context: ../web}
    image: hengdesk/web:${HENGDESK_VERSION:-dev}
    restart: unless-stopped
    ports: ["${HENGDESK_HTTP_PORT:-8080}:80"]
    depends_on: [server]

volumes:
  pgdata:
  backups:
  valkeydata:
  seaweeddata:
