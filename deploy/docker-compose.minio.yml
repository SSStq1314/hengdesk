# 可选：以 MinIO 替代默认 SeaweedFS。
# 注意：MinIO 社区版服务端为 AGPL-3.0，且自 2025-10 起官方不再发布社区版预编译二进制与镜像，
# 详见 docs/decisions/D-28-storage-cache-license.md。此处使用 Chainguard 免费镜像，生产使用前请经法务复核。
services:
  seaweedfs:
    profiles: ["disabled"]
  minio:
    image: ${HENGDESK_MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${HENGDESK_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${HENGDESK_S3_SECRET_KEY}
    volumes: [miniodata:/data]
    # 只绑本机回环（D-30）
    ports: ["127.0.0.1:${HENGDESK_S3_PORT:-9000}:9000"]
  migrate:
    environment: {HENGDESK_S3_ENDPOINT: "http://minio:9000"}
  server:
    environment: {HENGDESK_S3_ENDPOINT: "http://minio:9000"}
  worker:
    environment: {HENGDESK_S3_ENDPOINT: "http://minio:9000"}
volumes:
  miniodata:
