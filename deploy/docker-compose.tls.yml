# 可选 HTTPS：由 install.sh --tls-cert / --tls-key 启用。nginx 监听 443；HENGDESK_HTTP_PORT（默认 8080）上的明文请求按 HENGDESK_HTTP_REDIRECT 决定是否跳转 443。
services:
  web:
    ports:
      - "${HENGDESK_HTTPS_PORT:-443}:443"
    environment:
      HENGDESK_HTTP_REDIRECT: ${HENGDESK_HTTP_REDIRECT:-true}
      HENGDESK_HTTPS_PORT: ${HENGDESK_HTTPS_PORT:-443}
    volumes: ["./tls:/etc/hengdesk/tls:ro"]
