# install.sh 导入证书后启用：443 提供服务；明文端口（宿主机 80 / 8080）默认 301 跳转到 443，可由 HENGDESK_HTTP_REDIRECT=false 关闭。
server {
  listen 80;
  server_name _;
  # 健康检查保留明文，供本机探针使用
  location = /healthz { proxy_pass http://server:8080/healthz; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate /etc/hengdesk/tls/tls.crt;
  ssl_certificate_key /etc/hengdesk/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/hengdesk/proxy.inc;
}
