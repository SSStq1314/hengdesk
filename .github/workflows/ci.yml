name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    name: go (lint + test)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: server}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - uses: golangci/golangci-lint-action@v8
        with: {version: latest, working-directory: server}
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o /tmp/hengdesk ./cmd/hengdesk

  go-postgres:
    name: go (postgres17+pgvector 集成)
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: hengdesk, POSTGRES_PASSWORD: hengdesk, POSTGRES_DB: hengdesk}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hengdesk" --health-interval 2s --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
    env:
      HENGDESK_REDIS_ADDR: localhost:6379
      HENGDESK_DATABASE_URL: postgres://hengdesk:hengdesk@localhost:5432/hengdesk?sslmode=disable
      HENGDESK_ADMIN_EMAIL: admin@hengdesk.local
      HENGDESK_ADMIN_PASSWORD: ci-only-password-123
      PGPASSWORD: hengdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - working-directory: server
        run: CGO_ENABLED=0 go build -o /tmp/hengdesk ./cmd/hengdesk
      - name: 迁移目录与 ent schema 一致（Atlas 版本化迁移）
        working-directory: server
        run: go run ./cmd/migdiff -check -dev 'postgres://hengdesk:hengdesk@localhost:5432/postgres?sslmode=disable'
      - name: 迁移集成测试（只向前 / 防篡改 / 拒绝降级 / 拒绝 M0 旧库）
        working-directory: server
        run: |
          psql -h localhost -U hengdesk -d hengdesk -c 'CREATE DATABASE hengdesk_it'
          HENGDESK_PG_IT=1 HENGDESK_TEST_DATABASE_URL='postgres://hengdesk:hengdesk@localhost:5432/hengdesk_it?sslmode=disable' go test -count=1 -v -run 'Migrations|Legacy' ./internal/store/
      - name: migrate（两次，验证幂等）
        run: /tmp/hengdesk migrate && /tmp/hengdesk migrate
      - name: 审计表 append-only（UPDATE/DELETE/TRUNCATE 必须失败）
        run: |
          q() { psql -h localhost -U hengdesk -d hengdesk -v ON_ERROR_STOP=1 -c "$1"; }
          q "INSERT INTO audit_logs (ts, actor_email, action, resource_type, resource_id, phase, outcome, ip, user_agent, request_id, trace_id) VALUES (now(),'','ci','','','result','','','','','')"
          for s in "UPDATE audit_logs SET outcome='x'" "DELETE FROM audit_logs" "TRUNCATE audit_logs"; do
            if q "$s"; then echo "should fail: $s"; exit 1; fi
          done
          q "SELECT extname FROM pg_extension WHERE extname='vector'" | grep -q vector
      - name: server 登录冒烟
        run: |
          /tmp/hengdesk server & sleep 2
          curl -fsS localhost:8080/healthz
          curl -fsS -c /tmp/ck -H 'Content-Type: application/json' -d "{\"email\":\"$HENGDESK_ADMIN_EMAIL\",\"password\":\"$HENGDESK_ADMIN_PASSWORD\"}" localhost:8080/api/v1/auth/login
          curl -fsS -b /tmp/ck localhost:8080/api/v1/auth/me
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"admin@hengdesk.local","password":"bad-password"}' localhost:8080/api/v1/auth/login)" = 401
          # CSRF：不带 X-CSRF-Token 的变更请求被拒绝，带上则成功
          csrf=$(awk '$6=="hd_csrf"{print $7}' /tmp/ck)
          test -n "$csrf"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/ck -X POST localhost:8080/api/v1/auth/logout)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/ck -H "X-CSRF-Token: $csrf" -X POST localhost:8080/api/v1/auth/logout)" = 204
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/ck localhost:8080/api/v1/auth/me)" = 401
          # 账号锁定与凭据错误统一返回 401（D-33，避免账号枚举）
          for i in 1 2 3 4 5; do curl -s -o /dev/null -H 'Content-Type: application/json' -d '{"email":"lock@ci.local","password":"bad-password"}' localhost:8080/api/v1/auth/login; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"lock@ci.local","password":"bad-password"}' localhost:8080/api/v1/auth/login)" = 401
          # 同一 IP 超过 LOGIN_IP_LIMIT（默认 30 次 / 10 分钟）后返回 429 + Retry-After
          for i in $(seq 1 30); do curl -s -o /dev/null -H 'Content-Type: application/json' -d "{\"email\":\"ip$i@ci.local\",\"password\":\"bad-password\"}" localhost:8080/api/v1/auth/login; done
          curl -s -D /tmp/h -o /dev/null -H 'Content-Type: application/json' -d '{"email":"ip@ci.local","password":"bad-password"}' localhost:8080/api/v1/auth/login
          grep -q '^HTTP/1.1 429' /tmp/h && grep -qi '^Retry-After:' /tmp/h

  govulncheck:
    name: govulncheck（可达漏洞阻断）
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: server}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: 扫描并按可达性判定
        run: |
          govulncheck -format json ./... > ../govulncheck.json
          python3 ../.github/scripts/govulncheck-gate.py .govulncheck-exemptions.md < ../govulncheck.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: govulncheck, path: govulncheck.json}

  valkey:
    name: valkey 兼容性（asynq 入队/重试/延时/调度）
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8.1.11
        ports: ['6379:6379']
        options: --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
    env:
      HENGDESK_VALKEY_IT: '1'
      HENGDESK_REDIS_ADDR: localhost:6379
    defaults: {run: {working-directory: server}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - run: go test -race -count=1 -run TestValkeyAsynqCompat -v ./internal/queue/

  compose:
    name: compose 冒烟 + S3 集成（${{ matrix.storage }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [seaweedfs, minio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - name: install.sh 非交互生成 .env
        working-directory: deploy
        run: ./install.sh --non-interactive --storage ${{ matrix.storage }} --admin-password ci-only-password-123 --auditor-email auditor@hengdesk.local --auditor-password ci-only-auditor-456 --force
      - name: docker compose up
        working-directory: deploy
        run: docker compose up -d --build
      - name: 等待 web 就绪
        run: |
          for i in $(seq 1 90); do curl -fsS localhost:8080/healthz && break; sleep 2; done
          curl -fsS localhost:8080/healthz
      - name: 首页 200 + 登录成功
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/sign-in)" = 200
          curl -fsS -c /tmp/ck -H 'Content-Type: application/json' \
            -d '{"email":"admin@hengdesk.local","password":"ci-only-password-123"}' localhost:8080/api/v1/auth/login
          curl -fsS -b /tmp/ck localhost:8080/api/v1/auth/me
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/auth/me)" = 401
          # 安装时创建的初始安全审计员可登录（D-33）
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"email":"auditor@hengdesk.local","password":"ci-only-auditor-456"}' localhost:8080/api/v1/auth/login | grep -q security_auditor
      - name: 非 HTTPS 时后台提示 + 对象存储只绑 127.0.0.1（D-30）
        working-directory: deploy
        run: |
          curl -fsS -c /tmp/ck -H 'Content-Type: application/json' \
            -d '{"email":"admin@hengdesk.local","password":"ci-only-password-123"}' localhost:8080/api/v1/auth/login >/dev/null
          curl -fsS -b /tmp/ck -H 'X-Forwarded-Proto: https' localhost:8080/api/v1/admin/system/status | tee /tmp/st
          grep -q '"https":false' /tmp/st
          grep -q '"present":false' /tmp/st
          svc=seaweedfs; [ "${{ matrix.storage }}" = minio ] && svc=minio
          docker compose ps --format '{{.Publishers}}' "$svc" | tee /tmp/pub
          ! grep -E '0\.0\.0\.0|::' /tmp/pub
          grep -q '127.0.0.1' /tmp/pub
      - name: worker 运行中
        working-directory: deploy
        run: docker compose ps worker --status running --quiet | grep -q .
      - name: S3 集成测试（上传/下载/删除/列表/预签名）
        working-directory: server
        run: |
          set -a; . ../deploy/.env; set +a
          if [ "${{ matrix.storage }}" = minio ]; then export HENGDESK_S3_ENDPOINT=http://localhost:9000; else export HENGDESK_S3_ENDPOINT=http://localhost:8333; fi
          HENGDESK_S3_IT=1 go test -count=1 -run TestS3Integration -v ./internal/objstore/
      - name: 升级备份恢复冒烟（backup → upgrade → restore）
        if: matrix.storage == 'seaweedfs'
        working-directory: deploy
        run: |
          set -euo pipefail
          q() { docker compose exec -T postgres psql -U hengdesk -d hengdesk -tAc "$1"; }
          q "INSERT INTO audit_logs (ts, action) VALUES (now(), 'ci.restore.marker')"
          # 注入一个探针迁移，模拟新版本
          echo 'CREATE TABLE ci_probe (id int);' > ../server/internal/store/migrations/29991231000000_ci_upgrade_probe.sql
          (cd ../server && go run ./cmd/migdiff -hash)
          ./upgrade.sh --build
          test "$(q "SELECT to_regclass('ci_probe') IS NOT NULL")" = t
          B=$(docker compose exec -T postgres sh -c 'ls -1t /backups | head -1' | tr -d '\r')
          echo "backup=$B"; case "$B" in *pre-upgrade.dump) ;; *) exit 1 ;; esac
          ./restore.sh "$B" -y
          test "$(q "SELECT to_regclass('ci_probe') IS NULL")" = t
          test "$(q "SELECT count(*) FROM audit_logs WHERE action='ci.restore.marker'")" = 1
          for i in $(seq 1 60); do curl -fsS localhost:8080/healthz && break; sleep 2; done
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"email":"admin@hengdesk.local","password":"ci-only-password-123"}' localhost:8080/api/v1/auth/login >/dev/null
      - name: 失败时输出日志
        if: failure()
        working-directory: deploy
        run: docker compose ps -a && docker compose logs --no-color --tail 200

  compose-tls:
    name: compose 冒烟（HTTPS 自签证书）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 生成自签证书并以 TLS 模式安装
        working-directory: deploy
        run: |
          ./install.sh --non-interactive --storage seaweedfs --admin-password ci-only-password-123 \
            --self-signed --san localhost --san 127.0.0.1 --force
          grep -q '^HENGDESK_TLS_SELF_SIGNED=true' .env
          openssl x509 -in tls/tls.crt -noout -ext subjectAltName | tee /tmp/san
          grep -q 'DNS:localhost' /tmp/san && grep -q 'IP Address:127.0.0.1' /tmp/san
          days=$(( ($(date -d "$(openssl x509 -in tls/tls.crt -noout -enddate | cut -d= -f2)" +%s) - $(date +%s)) / 86400 ))
          test "$days" -ge 364 && test "$days" -le 366
          # 后续步骤沿用这张自签证书
          cp tls/tls.crt /tmp/ci.crt && cp tls/tls.key /tmp/ci.key
          # --self-signed 与 --tls-cert 互斥
          if ./install.sh --non-interactive --self-signed --tls-cert /tmp/ci.crt --tls-key /tmp/ci.key --force >/dev/null 2>&1; then exit 1; fi
          grep -q '^HENGDESK_COOKIE_SECURE=true' .env
          grep -q 'docker-compose.tls.yml' .env
          test "$(stat -c %a tls/tls.key)" = 600
          # 证书与私钥不匹配应被拒绝
          openssl genpkey -algorithm RSA -out /tmp/other.key 2>/dev/null
          if ./install.sh --non-interactive --tls-cert /tmp/ci.crt --tls-key /tmp/other.key --force >/dev/null 2>&1; then exit 1; fi
          grep -q '^HENGDESK_COOKIE_SECURE=true' .env
      - name: docker compose up
        working-directory: deploy
        run: docker compose up -d --build
      - name: HTTPS 登录、Secure cookie、80/8080 跳转、后台识别 HTTPS
        run: |
          for i in $(seq 1 90); do curl -fsS --cacert /tmp/ci.crt https://localhost/healthz && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert /tmp/ci.crt https://localhost/)" = 200
          for u in http://localhost/ http://localhost:8080/sign-in; do
            curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "$u" | tee /tmp/r
            grep -q '^301 https://localhost/' /tmp/r
          done
          curl -fsS --cacert /tmp/ci.crt -D /tmp/h -c /tmp/ck -H 'Content-Type: application/json' \
            -d '{"email":"admin@hengdesk.local","password":"ci-only-password-123"}' https://localhost/api/v1/auth/login >/dev/null
          grep -i '^set-cookie: hd_session=' /tmp/h | grep -qi 'secure'
          curl -fsS --cacert /tmp/ci.crt -b /tmp/ck https://localhost/api/v1/admin/system/status | tee /tmp/st
          grep -q '"https":true' /tmp/st
          grep -q '"self_signed":true' /tmp/st
          curl -fsS --cacert /tmp/ci.crt -b /tmp/ck https://localhost/api/v1/admin/system/tls | tee /tmp/tls
          grep -Eq '"days_left":36[45]' /tmp/tls && grep -q '"expiring":false' /tmp/tls
      - name: 改跳转端口（--redirect-port 8880）
        working-directory: deploy
        run: |
          # 重新安装会生成新的数据库密码，先清掉旧数据卷（只在 CI 里这样做）
          docker compose down -v
          ./install.sh --non-interactive --storage seaweedfs --admin-password ci-only-password-123 \
            --tls-cert /tmp/ci.crt --tls-key /tmp/ci.key --redirect-port 8880 --force
          grep -q '^HENGDESK_REDIRECT_PORT=8880' .env
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS --cacert /tmp/ci.crt https://localhost/healthz >/dev/null && break; sleep 2; done
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost:8880/x | tee /tmp/r
          grep -q '^301 https://localhost/x' /tmp/r
          if curl -s -m 3 -o /dev/null http://localhost:80/; then echo "80 仍被占用"; exit 1; fi
      - name: 关闭 HTTP 跳转（--no-http-redirect）
        working-directory: deploy
        run: |
          # 重新安装会生成新的数据库密码，先清掉旧数据卷（只在 CI 里这样做）
          docker compose down -v
          ./install.sh --non-interactive --storage seaweedfs --admin-password ci-only-password-123 \
            --tls-cert /tmp/ci.crt --tls-key /tmp/ci.key --no-http-redirect --force
          grep -q '^HENGDESK_HTTP_REDIRECT=false' .env
          if grep -q 'tls-redirect' .env; then exit 1; fi
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS --cacert /tmp/ci.crt https://localhost/healthz >/dev/null && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/sign-in)" = 404
          curl -fsS http://localhost:8080/healthz >/dev/null
          for p in 80 8880; do if curl -s -m 3 -o /dev/null "http://localhost:$p/"; then echo "$p 仍被占用"; exit 1; fi; done
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert /tmp/ci.crt https://localhost/)" = 200
      - name: 旧 .env 升级后保持 80 跳转
        working-directory: deploy
        run: |
          sed -i '/^HENGDESK_HTTP_REDIRECT=/d; /^HENGDESK_REDIRECT_PORT=/d' .env
          ./upgrade.sh
          grep -q 'tls-redirect' .env
          for i in $(seq 1 60); do curl -fsS --cacert /tmp/ci.crt https://localhost/healthz >/dev/null && break; sleep 2; done
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost/ | tee /tmp/r
          grep -q '^301 https://localhost/' /tmp/r
      - name: 失败时输出日志
        if: failure()
        working-directory: deploy
        run: docker compose ps -a && docker compose logs --no-color --tail 200

  web:
    name: web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: hashFiles('web/package.json') != ''
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with: {node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - if: hashFiles('web/package.json') != ''
        run: pnpm install --frozen-lockfile && pnpm lint && pnpm exec tsc -b && pnpm build
      - name: 前端文案集中检查
        working-directory: .
        run: ./scripts/check-web-locales.sh
      - if: hashFiles('web/package.json') == ''
        run: echo "web/ 尚未引入，跳过"
        working-directory: .

  license:
    name: license scan + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - name: Go 依赖许可（拒绝 AGPL/GPL/LGPL 等 forbidden/restricted 类）
        working-directory: server
        run: |
          go install github.com/google/go-licenses/v2@latest
          go-licenses check ./... --disallowed_types=forbidden,restricted,unknown --ignore github.com/SSStq1314/hengdesk
          go-licenses report ./... --ignore github.com/SSStq1314/hengdesk > ../go-licenses.csv
      - uses: pnpm/action-setup@v4
        if: hashFiles('web/package.json') != ''
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with: {node-version: 22}
      - name: npm 依赖许可（拒绝 GPL/AGPL/LGPL/SSPL）
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm licenses list --prod --json > ../npm-licenses.json
          node ../.github/scripts/check-npm-licenses.mjs ../npm-licenses.json
      - name: 生成 SBOM（syft, SPDX JSON）
        uses: anchore/sbom-action@v0
        with: {path: ., format: spdx-json, output-file: sbom.spdx.json, upload-artifact: false}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-licenses
          path: |
            sbom.spdx.json
            go-licenses.csv
            npm-licenses.json
          if-no-files-found: warn
