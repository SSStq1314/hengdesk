name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    name: go (lint + test)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: server}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - uses: golangci/golangci-lint-action@v8
        with: {version: latest, working-directory: server}
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o /tmp/hengdesk ./cmd/hengdesk

  go-postgres:
    name: go (postgres17+pgvector 集成)
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: hengdesk, POSTGRES_PASSWORD: hengdesk, POSTGRES_DB: hengdesk}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hengdesk" --health-interval 2s --health-retries 30
    env:
      HENGDESK_DATABASE_URL: postgres://hengdesk:hengdesk@localhost:5432/hengdesk?sslmode=disable
      HENGDESK_ADMIN_EMAIL: admin@hengdesk.local
      HENGDESK_ADMIN_PASSWORD: ci-only-password-123
      PGPASSWORD: hengdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - working-directory: server
        run: CGO_ENABLED=0 go build -o /tmp/hengdesk ./cmd/hengdesk
      - name: migrate（两次，验证幂等）
        run: /tmp/hengdesk migrate && /tmp/hengdesk migrate
      - name: 审计表 append-only（UPDATE/DELETE/TRUNCATE 必须失败）
        run: |
          q() { psql -h localhost -U hengdesk -d hengdesk -v ON_ERROR_STOP=1 -c "$1"; }
          q "INSERT INTO audit_logs (ts, actor_email, action, resource_type, resource_id, phase, outcome, ip, user_agent, request_id, trace_id) VALUES (now(),'','ci','','','result','','','','','')"
          for s in "UPDATE audit_logs SET outcome='x'" "DELETE FROM audit_logs" "TRUNCATE audit_logs"; do
            if q "$s"; then echo "should fail: $s"; exit 1; fi
          done
          q "SELECT extname FROM pg_extension WHERE extname='vector'" | grep -q vector
      - name: server 登录冒烟
        run: |
          /tmp/hengdesk server & sleep 2
          curl -fsS localhost:8080/healthz
          curl -fsS -c /tmp/ck -H 'Content-Type: application/json' -d "{\"email\":\"$HENGDESK_ADMIN_EMAIL\",\"password\":\"$HENGDESK_ADMIN_PASSWORD\"}" localhost:8080/api/v1/auth/login
          curl -fsS -b /tmp/ck localhost:8080/api/v1/auth/me
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"admin@hengdesk.local","password":"bad-password"}' localhost:8080/api/v1/auth/login)" = 401

  govulncheck:
    name: govulncheck（可达漏洞阻断）
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: server}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: 扫描并按可达性判定
        run: |
          govulncheck -format json ./... > ../govulncheck.json
          python3 ../.github/scripts/govulncheck-gate.py .govulncheck-exemptions.md < ../govulncheck.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: govulncheck, path: govulncheck.json}

  valkey:
    name: valkey 兼容性（asynq 入队/重试/延时/调度）
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8.1.11
        ports: ['6379:6379']
        options: --health-cmd "valkey-cli ping" --health-interval 2s --health-retries 30
    env:
      HENGDESK_VALKEY_IT: '1'
      HENGDESK_REDIS_ADDR: localhost:6379
    defaults: {run: {working-directory: server}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - run: go test -race -count=1 -run TestValkeyAsynqCompat -v ./internal/queue/

  compose:
    name: compose 冒烟 + S3 集成（${{ matrix.storage }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [seaweedfs, minio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - name: install.sh 非交互生成 .env
        working-directory: deploy
        run: ./install.sh --non-interactive --storage ${{ matrix.storage }} --admin-password ci-only-password-123 --force
      - name: docker compose up
        working-directory: deploy
        run: docker compose up -d --build
      - name: 等待 web 就绪
        run: |
          for i in $(seq 1 90); do curl -fsS localhost:8080/healthz && break; sleep 2; done
          curl -fsS localhost:8080/healthz
      - name: 首页 200 + 登录成功
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/sign-in)" = 200
          curl -fsS -c /tmp/ck -H 'Content-Type: application/json' \
            -d '{"email":"admin@hengdesk.local","password":"ci-only-password-123"}' localhost:8080/api/v1/auth/login
          curl -fsS -b /tmp/ck localhost:8080/api/v1/auth/me
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/auth/me)" = 401
      - name: worker 运行中
        working-directory: deploy
        run: docker compose ps worker --status running --quiet | grep -q .
      - name: S3 集成测试（上传/下载/删除/列表/预签名）
        working-directory: server
        run: |
          set -a; . ../deploy/.env; set +a
          if [ "${{ matrix.storage }}" = minio ]; then export HENGDESK_S3_ENDPOINT=http://localhost:9000; else export HENGDESK_S3_ENDPOINT=http://localhost:8333; fi
          HENGDESK_S3_IT=1 go test -count=1 -run TestS3Integration -v ./internal/objstore/
      - name: 失败时输出日志
        if: failure()
        working-directory: deploy
        run: docker compose ps -a && docker compose logs --no-color --tail 200

  web:
    name: web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: hashFiles('web/package.json') != ''
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with: {node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - if: hashFiles('web/package.json') != ''
        run: pnpm install --frozen-lockfile && pnpm lint && pnpm exec tsc -b && pnpm build
      - if: hashFiles('web/package.json') == ''
        run: echo "web/ 尚未引入，跳过"
        working-directory: .

  license:
    name: license scan + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10', cache-dependency-path: server/go.sum}
      - name: Go 依赖许可（拒绝 AGPL/GPL/LGPL 等 forbidden/restricted 类）
        working-directory: server
        run: |
          go install github.com/google/go-licenses/v2@latest
          go-licenses check ./... --disallowed_types=forbidden,restricted,unknown --ignore github.com/SSStq1314/hengdesk
          go-licenses report ./... --ignore github.com/SSStq1314/hengdesk > ../go-licenses.csv
      - uses: pnpm/action-setup@v4
        if: hashFiles('web/package.json') != ''
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with: {node-version: 22}
      - name: npm 依赖许可（拒绝 GPL/AGPL/LGPL/SSPL）
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm licenses list --prod --json > ../npm-licenses.json
          node ../.github/scripts/check-npm-licenses.mjs ../npm-licenses.json
      - name: 生成 SBOM（syft, SPDX JSON）
        uses: anchore/sbom-action@v0
        with: {path: ., format: spdx-json, output-file: sbom.spdx.json, upload-artifact: false}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-licenses
          path: |
            sbom.spdx.json
            go-licenses.csv
            npm-licenses.json
          if-no-files-found: warn
