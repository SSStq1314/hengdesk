# 从 main 的正式离线包升级到本分支打出的包。扫描的是这次打进新包的镜像。
name: 兼容回归
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg-upgrade:
    name: 旧包升级、失败回退与新库检查
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.11', cache-dependency-path: server/go.sum}
      - name: 构建 main 正式包和本分支新包
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add /tmp/hd-main origin/main
          /tmp/hd-main/deploy/pack-offline.sh --version main-prev --out /tmp/old-pack
          bash .github/scripts/install-pinned-scanners.sh /tmp/hd-scanners
          PATH="/tmp/hd-scanners:$PATH" HENGDESK_STRICT_SCAN=1 \
            ./deploy/pack-offline.sh --version compat-new --out /tmp/new-pack
          sha256sum /tmp/old-pack/*.tar.gz /tmp/new-pack/*.tar.gz | tee /tmp/compat-packs.sha256
      - name: 升级、失败演练、备份恢复、S3、信号
        run: bash tests/acceptance/ci/compat-pg-upgrade.sh
      - name: 失败或取消时归档现场
        if: always()
        run: |
          set +e
          mkdir -p /tmp/compat-evidence
          {
            echo "job_conclusion_step=archive"
            docker ps -a --no-trunc
            docker compose -f /tmp/compat-new/*/deploy/docker-compose.yml ps -a
            docker compose -f /tmp/compat-new/*/deploy/docker-compose.yml logs --no-color --tail 200
          } >> /tmp/compat-evidence/runner-archive.txt 2>&1
          cid=$(docker compose -f /tmp/compat-new/*/deploy/docker-compose.yml ps -q postgres 2>/dev/null || true)
          if [ -n "$cid" ]; then
            docker update --restart=unless-stopped "$cid" >> /tmp/compat-evidence/runner-archive.txt 2>&1
          fi
          docker compose -f /tmp/compat-new/*/deploy/docker-compose.yml down >> /tmp/compat-evidence/runner-archive.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-regression
          path: |
            /tmp/compat-packs.sha256
            /tmp/compat-evidence
            /tmp/new-pack/image-scan-compat-new
          if-no-files-found: warn
